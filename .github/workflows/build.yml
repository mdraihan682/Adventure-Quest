
name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Detect Android project
        id: android
        shell: bash
        run: |
          GRADLEW=$(find "$GITHUB_WORKSPACE" -path '*/gradlew' -type f | head -n 1 || true)
          if [ -z "$GRADLEW" ]; then
            echo "has_android=false" >> "$GITHUB_OUTPUT"
            echo "No Android project found. Skipping APK build."
          else
            echo "has_android=true" >> "$GITHUB_OUTPUT"
            echo "Android project found at: $(dirname "$GRADLEW")"
          fi

      - name: Build Debug APK
        if: steps.android.outputs.has_android == 'true'
        shell: bash
        run: |
          set -eux
          GRADLEW=$(find "$GITHUB_WORKSPACE" -path '*/gradlew' -type f | head -n 1)
          cd "$(dirname "$GRADLEW")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        if: steps.android.outputs.has_android == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error

      - name: Skip build if no Android project
        if: steps.android.outputs.has_android != 'true'
        run: echo "No Android project in this repository; build skipped."
